<!DOCTYPE html>
<html>
<head>
    <title>Gmail Checker</title>
    <style>
        body.dark { background: #1a1a1a; color: white; }
        body.light { background: #f0f0f0; color: black; }
        .sidebar { display: none; }
        .sidebar.active { display: block; }
    </style>
    <script>
        function setTheme(theme) {
            document.body.className = theme;
        }
        
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('active');
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setTheme('dark');
        });
    </script>
</head>
<body>
    <button onclick="setTheme('dark')">Dark</button>
    <button onclick="setTheme('light')">Light</button>
    <button onclick="toggleSidebar()">Toggle Sidebar</button>
    <div class="sidebar">Sidebar Content</div>
    
    <h1>Gmail Checker</h1>
    <textarea id="emails" placeholder="example@gmail.com"></textarea>
    <button onclick="checkEmails()">Check</button>
    
    <script>
        function checkEmails() {
            const emails = document.getElementById('emails').value;
            console.log('Checking:', emails);
        }
    </script>
</body>
</html>
