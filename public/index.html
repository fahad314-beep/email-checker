<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gmail Checker - Gmail Checker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2236;--border:#1e2d45;--accent:#00d4aa;--accent2:#0088ff;--danger:#ff4757;--warn:#ffa502;--text:#e8edf5;--muted:#5a7094}
body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,170,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,170,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.container{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:20px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 30px;border-bottom:1px solid var(--border);margin-bottom:30px}
.logo-text{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.badge{font-size:11px;color:var(--accent);border:1px solid rgba(0,212,170,.3);padding:4px 12px;border-radius:20px;background:rgba(0,212,170,.05)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.5}
.card-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title::after{content:'';flex:1;height:1px;background:var(--border)}
textarea{width:100%;height:180px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Mono',monospace;font-size:12.5px;padding:14px;resize:vertical;outline:none;transition:border-color .2s;line-height:1.7}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,170,.08)}
textarea::placeholder{color:var(--muted)}
.row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.mode-btn{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:11px;cursor:pointer;transition:all .2s;font-family:'DM Mono',monospace;text-align:center}
.mode-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,170,.07)}
.route-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.route-btn{padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:11px;cursor:pointer;transition:all .2s;font-family:'DM Mono',monospace;text-align:center}
.route-btn.active{border-color:var(--accent2);color:var(--accent2);background:rgba(0,136,255,.07)}
.chip{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:11.5px;cursor:pointer;transition:all .2s;font-family:'DM Mono',monospace}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip input{accent-color:var(--accent);width:13px;height:13px}
.btn-primary{flex:1;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgba(0,212,170,.25)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-sec{padding:13px 20px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-family:'DM Mono',monospace;font-size:13px;cursor:pointer;transition:all .2s}
.btn-sec:hover{border-color:var(--danger);color:var(--danger)}
.progress-wrap{margin-top:16px;display:none}
.progress-info{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .3s;width:0}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .2s}
.stat:hover{transform:translateY(-2px)}
.stat.active{border-color:currentColor}
.stat[data-t="good"]{color:#00d4aa}.stat[data-t="good"].active{background:rgba(0,212,170,.05)}
.stat[data-t="verified"]{color:#0088ff}.stat[data-t="verified"].active{background:rgba(0,136,255,.05)}
.stat[data-t="notexist"]{color:#ff4757}.stat[data-t="notexist"].active{background:rgba(255,71,87,.05)}
.stat[data-t="remaining"]{color:#ffa502}.stat[data-t="remaining"].active{background:rgba(255,165,2,.05)}
.stat-num{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;line-height:1;margin-bottom:4px}
.stat-label{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:2px}
.results-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:none}
.results-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface2)}
.results-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
.copy-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;font-family:'DM Mono',monospace;transition:all .2s}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.results-list{max-height:320px;overflow-y:auto;padding:12px}
.result-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:7px;margin-bottom:4px;font-size:12px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.result-item.good{background:rgba(0,212,170,.07);border:1px solid rgba(0,212,170,.15)}
.result-item.verified{background:rgba(0,136,255,.07);border:1px solid rgba(0,136,255,.15)}
.result-item.notexist{background:rgba(255,71,87,.07);border:1px solid rgba(255,71,87,.15)}
.result-item.remaining{background:rgba(255,165,2,.07);border:1px solid rgba(255,165,2,.15)}
.result-email{color:var(--text)}
.result-badge{font-size:10px;padding:2px 9px;border-radius:4px;text-transform:uppercase;letter-spacing:1px}
.result-item.good .result-badge{background:rgba(0,212,170,.15);color:#00d4aa}
.result-item.verified .result-badge{background:rgba(0,136,255,.15);color:#0088ff}
.result-item.notexist .result-badge{background:rgba(255,71,87,.15);color:#ff4757}
.result-item.remaining .result-badge{background:rgba(255,165,2,.15);color:#ffa502}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px 24px;font-size:13px;color:var(--accent);z-index:9999;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:all}
footer{text-align:center;padding:30px 0 20px;color:var(--muted);font-size:11px;letter-spacing:1px}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr)}.route-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body onload="setTheme('light')">
<div class="container">
<header>
<div class="logo">
<div class="logo-text"><span style="-webkit-text-fill-color:#7c3aed">G</span><span style="-webkit-text-fill-color:#8b35e8">m</span><span style="-webkit-text-fill-color:#9929e0">a</span><span style="-webkit-text-fill-color:#a71dd8">i</span><span style="-webkit-text-fill-color:#b511cf">l</span><span style="-webkit-text-fill-color:#c30ac7"> </span><span style="-webkit-text-fill-color:#d10ebf">A</span><span style="-webkit-text-fill-color:#dc12b8">c</span><span style="-webkit-text-fill-color:#e516b0">c</span><span style="-webkit-text-fill-color:#ee1fa8">o</span><span style="-webkit-text-fill-color:#f428a0">u</span><span style="-webkit-text-fill-color:#f83298">n</span><span style="-webkit-text-fill-color:#f94490">t</span><span style="-webkit-text-fill-color:#f85688"> </span><span style="-webkit-text-fill-color:#f56880">I</span><span style="-webkit-text-fill-color:#f07878">n</span><span style="-webkit-text-fill-color:#e88870">s</span><span style="-webkit-text-fill-color:#df9868">p</span><span style="-webkit-text-fill-color:#d4a860">e</span><span style="-webkit-text-fill-color:#c8b858">c</span><span style="-webkit-text-fill-color:#bcc850">t</span><span style="-webkit-text-fill-color:#afd848">o</span><span style="-webkit-text-fill-color:#a0e840">r</span></div>

</div>
<div style="display:flex;gap:8px;align-items:center"><button onclick="setTheme('dark')" id="btn-dark" style="padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:11px;font-family:'DM Mono',monospace">🌙 Dark</button><button onclick="setTheme('light')" id="btn-light" style="padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:11px;font-family:'DM Mono',monospace">☀️ Light</button><div class="badge">FREE TOOL</div></div>
</header>
<div class="card">
<div class="card-title ct-heading">Account List</div>
<textarea id="emailInput" placeholder="Enter emails one per line&#10;example@gmail.com&#10;test@gmail.com"></textarea>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;margin-bottom:14px">
<span style="font-size:11px;color:var(--muted)" id="countLabel">0 accounts</span>
</div>
<div class="card-title ct-heading">Type Mode</div>
<div class="row">
<div class="mode-btn active" onclick="setMode(this,'personal')">Personal Account Mode</div>

</div>
<div class="card-title ct-heading">Route</div>
<div class="route-grid">
<div class="route-btn active" onclick="setRoute(this,'free')">Free Route</div>
<div class="route-btn" onclick="setRoute(this,'vip1')">VIP1 Route</div>


</div>
<div class="row">
<label class="chip"><input type="checkbox" id="optRepeat"> Repeat Detection</label>
<label class="chip"><input type="checkbox" id="optIgnore" checked> Ignore Format Errors</label>
<label class="chip"><input type="checkbox" id="optExists"> Check if Exists</label>
</div>
<div class="row" style="margin-top:16px">
<button class="btn-primary" id="startBtn" onclick="startCheck()">&#9654; Start Check</button>
<button class="btn-sec" onclick="clearAll()">&#x2715; Clear</button>
</div>
<div class="progress-wrap" id="progressWrap">
<div class="progress-info"><span id="progressText">Checking...</span><span id="progressPct">0%</span></div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>
</div>
<div class="stats-grid">
<div class="stat active" data-t="good" onclick="showTab('good')"><div class="stat-num" id="cGood">0</div><div class="stat-label">Good</div></div>
<div class="stat" data-t="verified" onclick="showTab('verified')"><div class="stat-num" id="cVerified">0</div><div class="stat-label">Verified</div></div>
<div class="stat" data-t="notexist" onclick="showTab('notexist')"><div class="stat-num" id="cNotExist">0</div><div class="stat-label">Not Exist</div></div>
<div class="stat" data-t="remaining" onclick="showTab('remaining')"><div class="stat-num" id="cRemaining">0</div><div class="stat-label">Remaining</div></div>
</div>
<div class="results-card" id="resultsCard">
<div class="results-header">
<div class="results-title" id="resultsTitle">Good List</div>
<button class="copy-btn" onclick="copyList()">Copy List</button>
</div>
<div class="results-list" id="resultsList"><div class="empty">No results yet</div></div>
</div>
<footer>Gmail Checker &copy; Gmail Account Checker &nbsp;&middot;&nbsp; No password required &nbsp;&middot;&nbsp; Safe &amp; Fast</footer>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><br><br><button onclick="document.getElementById('toast').classList.remove('show')" style="width:100%;background:none;border:1px solid var(--muted);color:var(--text);border-radius:6px;padding:4px;cursor:pointer;font-size:12px">Close ✕</button></div>
<script>
let results={good:[],verified:[],notexist:[],remaining:[]};
let currentTab='good';
document.getElementById('emailInput').addEventListener('input',updateCount);
function updateCount(){const e=getEmails();document.getElementById('countLabel').textContent=e.length+' accounts';}
function getEmails(){return document.getElementById('emailInput').value.split('\n').map(e=>e.trim()).filter(e=>e&&e.includes('@'));}
function setMode(el,m){document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function setRoute(el,r){document.querySelectorAll('.route-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
async function startCheck(){
const optRepeat=document.getElementById("optRepeat").checked;
const allEmails=getEmails();
if(!allEmails.length){showToast("Enter at least one email!");return;}

if(optRepeat){
  const seen=new Set();
  const dups=[];
  allEmails.forEach(e=>{seen.has(e)?dups.push(e):seen.add(e);});
  if(dups.length>0){
    showToast("⛔ "+dups.length+" duplicates found! Remove them or turn off Repeat Detection.");
    return;
  }
}

const emails=allEmails;
results={good:[],verified:[],notexist:[],remaining:[...emails]};
updateStats();
const btn=document.getElementById("startBtn");
btn.disabled=true;btn.innerHTML="<span class=\"spinner\"></span>Checking...";
document.getElementById("progressWrap").style.display="block";
document.getElementById("resultsCard").style.display="block";
showTab(currentTab);
const bs=5;let done=0;
for(let i=0;i<emails.length;i+=bs){
const batch=emails.slice(i,i+bs);
try{
const res=await fetch("/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({emails:batch})});
const data=await res.json();
data.forEach(r=>{
results.remaining=results.remaining.filter(e=>e!==r.email);
if(r.status==="good")results.good.push(r.email);
else if(r.status==="verified")results.verified.push(r.email);
else results.notexist.push(r.email);
});
}catch(err){batch.forEach(e=>{results.remaining=results.remaining.filter(x=>x!==e);results.notexist.push(e);});}
done+=batch.length;
const pct=Math.round((done/emails.length)*100);
document.getElementById("progressFill").style.width=pct+"%";
document.getElementById("progressPct").textContent=pct+"%";
document.getElementById("progressText").textContent="Checked "+done+" / "+emails.length;
updateStats();showTab(currentTab);
}
btn.disabled=false;btn.innerHTML="&#9654; Start Check";

}
function updateStats(){
document.getElementById('cGood').textContent=results.good.length;
document.getElementById('cVerified').textContent=results.verified.length;
document.getElementById('cNotExist').textContent=results.notexist.length;
document.getElementById('cRemaining').textContent=results.remaining.length;
}
function showTab(type){
currentTab=type;
document.querySelectorAll('.stat').forEach(c=>c.classList.remove('active'));
document.querySelector('.stat[data-t="'+type+'"]').classList.add('active');
const titles={good:'Good List',verified:'Verified List',notexist:'Not Exist List',remaining:'Remaining List'};
document.getElementById('resultsTitle').textContent=titles[type];
const list=results[type];
const container=document.getElementById('resultsList');
if(!list.length){container.innerHTML='<div class="empty">No results in this category</div>';return;}
container.innerHTML=list.map(email=>'<div class="result-item '+type+'"><span class="result-email">'+email+'</span><span class="result-badge">'+type+'</span></div>').join('');
}
function copyList(){
const list=results[currentTab];
if(!list.length){showToast('Nothing to copy!');return;}
navigator.clipboard.writeText(list.join('\n')).then(()=>showToast('Copied '+list.length+' emails!'));
}
function clearAll(){
document.getElementById('emailInput').value='';
results={good:[],verified:[],notexist:[],remaining:[]};
updateStats();
document.getElementById('resultsCard').style.display='none';
document.getElementById('progressWrap').style.display='none';
document.getElementById('progressFill').style.width='0%';
updateCount();showToast('Cleared!');
}
function showToast(msg){
const t=document.getElementById('toast');
document.getElementById('toastMsg').textContent=msg;
t.classList.add('show');
}
</script>
<div id="cursor-glow"></div><script>const g=document.getElementById("cursor-glow");document.addEventListener("mousemove",e=>{g.style.left=e.clientX+"px";g.style.top=e.clientY+"px";});document.head.insertAdjacentHTML("beforeend","<style>#cursor-glow{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(120,120,255,0.35) 0%,transparent 70%);pointer-events:none;transform:translate(-50%,-50%);transition:left 0.1s,top 0.1s;z-index:0;}</style>");</script><style>
body.light{--bg:#f0f4f8;--surface:#ffffff;--surface2:#e8edf5;--border:#d0d9e8;--text:#1a2236;--muted:#555e6e;--accent:#0066cc;--accent2:#00a884}
body.light .logo-text{background:linear-gradient(90deg,#0066cc,#00a884);-webkit-background-clip:text;background-clip:text}
body.light .card-title{color:#333}
body.light .mode-btn{color:#333;border-color:#bbc}
body.light .route-btn{color:#333;border-color:#bbc}
body.light .chip{color:#333;border-color:#bbc}
body.light textarea{color:#1a2236}
body.light .result-email{color:#1a2236}
</style>
<script>
function setTheme(t){document.body.className=t;
  document.body.className=t;
  document.getElementById("btn-dark").style.borderColor=t==="dark"?"var(--accent)":"var(--border)";
  document.getElementById("btn-light").style.borderColor=t==="light"?"var(--accent)":"var(--border)";
}
</script>
</body>
</html>
