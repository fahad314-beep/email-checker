<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Email Checker</title>
<style>
body{font-family:Arial,sans-serif;max-width:800px;margin:50px auto;padding:20px;background:#f5f5f5}
h1{color:#333}
textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:5px}
button{margin-top:10px;padding:10px 25px;background:#4CAF50;color:white;border:none;border-radius:5px;cursor:pointer;font-size:16px}
.valid{background:#d4edda;color:#155724;padding:8px;margin:5px 0;border-radius:4px}
.invalid{background:#f8d7da;color:#721c24;padding:8px;margin:5px 0;border-radius:4px}
</style>
</head>
<body>
<h1>Email Checker</h1>
<textarea id="emails" placeholder="test@gmail.com"></textarea><br>
<button onclick="check()">Check Emails</button>
<div id="results"></div>
<script>
async function check(){
const emails=document.getElementById('emails').value.split('\n').map(e=>e.trim()).filter(e=>e);
if(!emails.length)return alert('Enter emails!');
document.getElementById('results').innerHTML='<p>Checking...</p>';
const res=await fetch('/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({emails})});
const data=await res.json();
document.getElementById('results').innerHTML=data.map(r=>`<div class="${r.status==='valid'?'valid':'invalid'}">${r.email} - ${r.status}</div>`).join('');
}
</script>
</body>
</html>
